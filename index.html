<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tenis Katılım</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:520px;margin:0 auto;padding:16px;background:#f4f7f2}
  .slot{background:#fff;border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 3px #0002}
  .slot h2{margin:0 0 4px;font-size:1.1rem}
  .slot small{color:#666}
  button{font:inherit;padding:10px 14px;border:0;border-radius:8px;background:#2e7d32;color:#fff;cursor:pointer;margin-top:8px}
  button.leave{background:#c62828}button.ghost{background:#888}button:disabled{background:#bbb}
  ol{margin:8px 0 0;padding-left:22px}li.me{font-weight:700}
  #admin{background:#fff8e1;padding:12px;border-radius:12px}
  input{font:inherit;padding:8px;margin:2px;width:calc(50% - 20px)}
</style>
<body>
<h1>🎾 Tenis Antrenmanı</h1>
<p id="who"></p>
<div id="admin" hidden>
  <b>Hoca paneli</b><br>
  <input id="label" placeholder="Örn: Salı 19:00">
  <input id="cap" type="number" value="16" min="1">
  <button id="add">Saat ekle</button>
</div>
<div id="slots"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const DB_URL = "https://tenis-katilim-default-rtdb.firebaseio.com";
const ADMIN_PIN = "0000"; // shortcut: istemci tarafı kontrol, ciddi güvenlik değil; gerekirse Firebase Auth'a geçilir
firebase.initializeApp({databaseURL: DB_URL});
const db = firebase.database();

let name = localStorage.getItem("name");
while (!name || !name.trim()) name = prompt("Ad Soyad (bir kez girilir):");
name = name.trim().replace(/\s+/g, " ");
localStorage.setItem("name", name);
const key = name.toLocaleLowerCase("tr").replace(/[.#$\[\]\/]/g, "_");

const isAdmin = location.hash === "#admin" && prompt("Hoca PIN:") === ADMIN_PIN;
document.getElementById("admin").hidden = !isAdmin;

const who = document.getElementById("who");
who.append("Merhaba ", Object.assign(document.createElement("b"), {textContent: name}), " · ");
const change = Object.assign(document.createElement("a"), {textContent: "ben değilim", href: "#"});
change.onclick = e => { e.preventDefault(); localStorage.removeItem("name"); location.reload(); };
who.append(change);

function el(tag, props, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...kids);
  return n;
}

function toggle(id, cap) {
  db.ref(`slots/${id}/people`).transaction(p => {
    p = p || {};
    if (p[key]) delete p[key];
    else if (Object.keys(p).length >= cap) return;
    else p[key] = {n: name, t: firebase.database.ServerValue.TIMESTAMP};
    return p;
  }, (err, committed) => { if (!err && !committed) alert("Bu saat dolu."); });
}

db.ref("slots").on("value", snap => {
  const box = document.getElementById("slots");
  box.replaceChildren();
  const slots = snap.val() || {};
  if (!Object.keys(slots).length) box.append(el("p", {textContent: "Henüz saat eklenmedi."}));
  for (const [id, s] of Object.entries(slots)) {
    const people = s.people || {};
    const joined = !!people[key];
    const full = Object.keys(people).length >= s.cap;
    // katılma sırası: eski kayıtlar düz metin (t yok), en başa gelir
    const ordered = Object.entries(people).sort(([, a], [, b]) => (a.t || 0) - (b.t || 0));
    const list = el("ol", {}, ...ordered.map(([k, v]) => el("li", {textContent: v.n || v, className: k === key ? "me" : ""})));
    const btn = el("button", {
      textContent: joined ? "Vazgeç" : full ? "Dolu" : "Katılıyorum",
      className: joined ? "leave" : "",
      disabled: full && !joined,
      onclick: () => toggle(id, s.cap)
    });
    const card = el("div", {className: "slot"},
      el("h2", {textContent: s.label}),
      el("small", {textContent: `${Object.keys(people).length} / ${s.cap} kişi`}),
      el("br"), btn);
    if (isAdmin) card.append(" ", el("button", {textContent: "Saati sil", className: "ghost", onclick: () => confirm("Silinsin mi?") && db.ref("slots/" + id).remove()}));
    card.append(list);
    box.append(card);
  }
});

document.getElementById("add").onclick = () => {
  const label = document.getElementById("label").value.trim();
  const cap = parseInt(document.getElementById("cap").value, 10);
  if (!label || !(cap > 0)) return alert("Saat ve kontenjan gerekli.");
  db.ref("slots").push({label, cap});
  document.getElementById("label").value = "";
};
</script>
</body>
</html>
